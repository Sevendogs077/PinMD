<svg width="1280" height="320" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* 默认浅色模式下的颜色 (深灰) */
    .pin-text { fill: #333333; }
    
    /* 黑暗模式检测：自动变白 */
    @media (prefers-color-scheme: dark) {
      .pin-text { fill: #ffffff; }
    }
  </style>

  <defs>
    <filter id="box-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="rgba(64, 169, 255, 0.1)" result="colorBlur"/>
      <feComposite in="colorBlur" in2="offsetBlur" operator="in" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>

    <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(640, 160)">
    
    <rect x="-360" y="-90" width="720" height="180" rx="24" ry="24"
          fill="rgba(64, 169, 255, 0.05)" 
          stroke="rgba(64, 169, 255, 0.25)" stroke-width="1.5"
          filter="url(#box-shadow)" />

    <g font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-weight="bold" 
       text-anchor="middle" dominant-baseline="central" letter-spacing="-5">
       
       <g transform="translate(-40, 0)">
         <text x="-60" y="-10" font-size="180" class="pin-text">Pin</text>
         <text x="140" y="-10" font-size="180" fill="#40a9ff" filter="url(#text-glow)">MD</text>
       </g>
    </g>
    
  </g>
</svg>